    <main>
        <section>
            <h2>Contact Me</h2>
            <form action="" method="post">
                <label for="name">Name: </label><br>
                <input type="text" name="name" id="name" required><br>
                <label for="email">Email: </label><br>
                <input type="email" name="email" id="email" required><br>
                <label for="subject">Subject: </label><br>
                <input type="text" name="subject" id="subject" required><br>
                <label for="message">Message: </label><br>
                <textarea name="message" id="message" required></textarea><br><br>


                <label>Reason for contacting: </label><br>
                <input type="radio" name="reason" id="project" value="project" required>
                <label for="project">Project collaboration</label><br>
                <input type="radio" name="reason" id="question" value="question">
                <label for="question">General Question</label><br>
                <input type="radio" name="reason" id="feedback" value="feedback">
                <label for="feedback">Feedback</label><br>
                <input type="radio" name="reason" id="other" value="other">
                <label for="other">Other</label><br>
                
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>© Husam's Cyber Lab Project 2026-20XX</p>
    </footer>
